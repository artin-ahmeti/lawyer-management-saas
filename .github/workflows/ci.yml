name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm --filter '!@lawfirm/db' test

      - name: Production builds
        run: pnpm build

      - name: Dependency security audit
        run: pnpm audit --audit-level high

  # BLOCKING: tenant isolation. Firm A must never read or write firm B (Plan §8).
  rls-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd 'redis-cli ping'
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase (applies supabase/migrations)
        run: pnpm supabase start

      - name: Run RLS isolation suite
        run: pnpm --filter @lawfirm/db test

      - name: Build API contracts and service
        run: pnpm --filter @lawfirm/api... build

      - name: Run durable command integration suite
        run: pnpm --filter @lawfirm/api test:integration

      - name: Run outbox and worker recovery suite
        run: pnpm --filter @lawfirm/worker test:integration
        env:
          REDIS_URL: redis://127.0.0.1:6379

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase stop
