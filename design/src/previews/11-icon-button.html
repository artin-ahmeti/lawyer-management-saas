<!-- @card dir="IconButton" group="Actions" title="Icon button & Capture" subtitle="Header actions with badge · the Capture action" height=200 -->
<div class="pv">
  <div class="pv-row">
    <button class="cl-iconbtn" aria-label="Inbox"><svg class="cl-ic"><use href="#i-inbox"/></svg><span class="cl-badge">3</span></button>
    <button class="cl-iconbtn" aria-label="Search"><svg class="cl-ic"><use href="#i-search"/></svg></button>
    <button class="cl-iconbtn cl-iconbtn--plain" aria-label="More"><svg class="cl-ic"><use href="#i-more"/></svg></button>
    <button class="cl-iconbtn cl-iconbtn--sm" aria-label="Close"><svg class="cl-ic cl-ic--sm"><use href="#i-x"/></svg></button>
    <span style="width:24px"></span>
    <button class="cl-capture-btn" aria-label="Capture"><svg class="cl-ic"><use href="#i-plus"/></svg></button>
    <span class="pv-note">Capture is the only raised, round, accent-filled control in the app. It opens the Capture sheet: timer, voice memo, time, expense, task, note.</span>
  </div>
  <div class="pv-row cl-theme-dark pv-pane" style="padding:12px 16px">
    <button class="cl-iconbtn" aria-label="Inbox"><svg class="cl-ic"><use href="#i-inbox"/></svg><span class="cl-badge">3</span></button>
    <button class="cl-iconbtn" aria-label="Search"><svg class="cl-ic"><use href="#i-search"/></svg></button>
    <button class="cl-capture-btn" aria-label="Capture"><svg class="cl-ic"><use href="#i-plus"/></svg></button>
  </div>
</div>
