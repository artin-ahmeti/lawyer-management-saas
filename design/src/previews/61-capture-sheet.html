<!-- @card dir="CaptureSheet" group="Domain" title="Capture sheet" subtitle="The one place to record work: timer, voice, time, expense, task, note" height=380 -->
<div class="pv">
  <div class="pv-cols">
    <div class="pv-pane pv-mobile" style="background:var(--surface-2);padding:40px 0 0;border-radius:20px;overflow:hidden">
      <div class="cl-sheet">
        <div class="cl-sheet__grab"></div>
        <div class="cl-sheet__head"><h2 class="cl-sheet__title">Capture</h2><span class="cl-t-label cl-muted">to <b style="color:var(--ink)">Estate of Bennett</b></span></div>
        <div class="cl-capture">
          <button class="cl-capture__item"><span class="cl-ic-well cl-ic-well--accent"><svg class="cl-ic"><use href="#i-play"/></svg></span>Start timer</button>
          <button class="cl-capture__item"><span class="cl-ic-well cl-ic-well--accent"><svg class="cl-ic"><use href="#i-mic"/></svg></span>Voice memo</button>
          <button class="cl-capture__item"><span class="cl-ic-well cl-ic-well--accent"><svg class="cl-ic"><use href="#i-clock"/></svg></span>Log time</button>
          <button class="cl-capture__item"><span class="cl-ic-well"><svg class="cl-ic"><use href="#i-camera"/></svg></span>Expense</button>
          <button class="cl-capture__item"><span class="cl-ic-well"><svg class="cl-ic"><use href="#i-check"/></svg></span>Task</button>
          <button class="cl-capture__item"><span class="cl-ic-well"><svg class="cl-ic"><use href="#i-pen"/></svg></span>Note</button>
        </div>
        <div class="cl-chips"><span class="cl-t-caption cl-muted" style="align-self:center;flex:none">Recent</span><button class="cl-chip is-active">Estate of Bennett</button><button class="cl-chip">People v. Webb</button><button class="cl-chip">Kessler</button></div>
      </div>
    </div>
    <div class="pv-pane pv-mobile cl-theme-dark" style="padding:40px 0 0;border-radius:20px;overflow:hidden">
      <div class="cl-sheet">
        <div class="cl-sheet__grab"></div>
        <div class="cl-sheet__head"><h2 class="cl-sheet__title">Voice memo</h2><span class="cl-pill cl-pill--danger"><span class="cl-pill__dot"></span>Recording 0:14</span></div>
        <div class="cl-card" style="min-height:96px;display:flex;align-items:center;justify-content:center;gap:3px">
          <i style="width:3px;height:14px;border-radius:2px;background:var(--accent)"></i><i style="width:3px;height:28px;border-radius:2px;background:var(--accent)"></i><i style="width:3px;height:40px;border-radius:2px;background:var(--accent)"></i><i style="width:3px;height:22px;border-radius:2px;background:var(--accent)"></i><i style="width:3px;height:34px;border-radius:2px;background:var(--accent)"></i><i style="width:3px;height:16px;border-radius:2px;background:var(--accent)"></i><i style="width:3px;height:30px;border-radius:2px;background:var(--accent)"></i><i style="width:3px;height:12px;border-radius:2px;background:var(--border)"></i><i style="width:3px;height:12px;border-radius:2px;background:var(--border)"></i><i style="width:3px;height:12px;border-radius:2px;background:var(--border)"></i>
        </div>
        <p class="cl-t-label cl-muted">Transcribed on device. Say the matter and the time: “Bennett, point three, call with the appraiser.”</p>
        <div class="cl-btn-row"><button class="cl-btn cl-btn--secondary">Cancel</button><button class="cl-btn cl-btn--primary"><svg class="cl-ic"><use href="#i-stop"/></svg>Done</button></div>
      </div>
    </div>
  </div>
</div>
