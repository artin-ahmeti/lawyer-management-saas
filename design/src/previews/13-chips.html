<!-- @card dir="Chips" group="Actions" title="Filter chips" subtitle="Selected = ink fill · counts in tabular figures · scrolls horizontally on mobile" height=200 -->
<div class="pv">
  <div class="pv-mobile pv-col">
    <div class="cl-chips">
      <button class="cl-chip is-active">All <span class="cl-chip__count">12</span></button>
      <button class="cl-chip">Open <span class="cl-chip__count">9</span></button>
      <button class="cl-chip">Mine <span class="cl-chip__count">5</span></button>
      <button class="cl-chip">Pending <span class="cl-chip__count">2</span></button>
      <button class="cl-chip">Closed</button>
    </div>
    <div class="cl-chips">
      <button class="cl-chip"><svg class="cl-ic"><use href="#i-sliders"/></svg>Filters</button>
      <button class="cl-chip">Practice area <svg class="cl-ic"><use href="#i-chevron-down"/></svg></button>
      <button class="cl-chip is-active">Probate <svg class="cl-ic"><use href="#i-x"/></svg></button>
      <button class="cl-chip">Stage <svg class="cl-ic"><use href="#i-chevron-down"/></svg></button>
    </div>
  </div>
  <div class="pv-row cl-theme-dark pv-pane" style="padding:12px 16px">
    <button class="cl-chip is-active">All <span class="cl-chip__count">12</span></button>
    <button class="cl-chip">Open <span class="cl-chip__count">9</span></button>
    <button class="cl-chip">Mine <span class="cl-chip__count">5</span></button>
  </div>
</div>
