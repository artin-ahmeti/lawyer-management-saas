<!-- @card dir="SegmentedControl" group="Actions" title="Segmented control" subtitle="In-page tabs on mobile · block and scrolling forms" height=240 -->
<div class="pv">
  <div class="pv-mobile pv-col">
    <div class="cl-seg cl-seg--block">
      <button class="cl-seg__item is-active">Unbilled</button>
      <button class="cl-seg__item">Invoices</button>
      <button class="cl-seg__item">Payments</button>
      <button class="cl-seg__item">Trust</button>
    </div>
    <div class="cl-seg cl-seg--scroll">
      <button class="cl-seg__item is-active">Overview</button>
      <button class="cl-seg__item">Activity</button>
      <button class="cl-seg__item">Tasks <span class="cl-chip__count">4</span></button>
      <button class="cl-seg__item">Time</button>
      <button class="cl-seg__item">Documents</button>
      <button class="cl-seg__item">Billing</button>
    </div>
    <div class="cl-seg" style="align-self:flex-start">
      <button class="cl-seg__item is-active">Week</button>
      <button class="cl-seg__item">Month</button>
      <button class="cl-seg__item">Quarter</button>
    </div>
  </div>
  <p class="pv-note">Segmented controls switch views of the same object (a matter, the billing area). Filters that narrow a list use chips instead.</p>
</div>
