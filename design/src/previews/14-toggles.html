<!-- @card dir="Toggles" group="Actions" title="Switch · checkbox · radio" subtitle="22px round check for tasks, square for forms, 44×26 switch" height=300 -->
<div class="pv">
  <div class="pv-cols">
    <div class="pv-pane pv-pane--surface pv-mobile">
      <div class="pv-label">Settings rows</div>
      <div class="cl-option"><span>Billable</span><span class="cl-switch is-on" role="switch" aria-checked="true"></span></div>
      <div class="cl-divider"></div>
      <div class="cl-option"><span>Courthouse mode <span class="cl-t-caption cl-muted" style="display:block">Silent, dark, quick notes</span></span><span class="cl-switch" role="switch" aria-checked="false"></span></div>
      <div class="cl-divider"></div>
      <div class="cl-option"><span>Stay signed in with Face ID</span><span class="cl-switch is-on" role="switch" aria-checked="true"></span></div>
    </div>
    <div class="pv-pane pv-pane--surface pv-mobile">
      <div class="pv-label">Checks and radios</div>
      <div class="pv-row" style="gap:16px">
        <span class="cl-check"><svg class="cl-ic"><use href="#i-check"/></svg></span>
        <span class="cl-check is-on"><svg class="cl-ic"><use href="#i-check"/></svg></span>
        <span class="cl-check cl-check--square"><svg class="cl-ic"><use href="#i-check"/></svg></span>
        <span class="cl-check cl-check--square is-on"><svg class="cl-ic"><use href="#i-check"/></svg></span>
        <span class="cl-radio"></span>
        <span class="cl-radio is-on"></span>
      </div>
      <div class="cl-stack cl-stack--sm" style="margin-top:16px">
        <label class="cl-option" style="padding:8px 0"><span class="cl-radio is-on"></span>Operating account</label>
        <label class="cl-option" style="padding:8px 0"><span class="cl-radio"></span>Trust account <span class="cl-mono" style="margin-left:auto">····4821</span></label>
      </div>
    </div>
  </div>
</div>
