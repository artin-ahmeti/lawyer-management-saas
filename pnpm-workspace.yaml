packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@scarf/scarf': false # telemetry only
  '@sentry/cli': true
  '@shopify/react-native-skia': false # prebuilt binaries ship in the package; iOS build verified without it
  esbuild: true
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - '@supabase/cli-darwin-arm64@2.115.0'
  - '@supabase/cli-darwin-x64@2.115.0'
  - '@supabase/cli-linux-arm64-musl@2.115.0'
  - '@supabase/cli-linux-arm64@2.115.0'
  - '@supabase/cli-linux-x64-musl@2.115.0'
  - '@supabase/cli-linux-x64@2.115.0'
  - '@supabase/cli-windows-arm64@2.115.0'
  - '@supabase/cli-windows-x64@2.115.0'
  - '@turbo/darwin-64@2.10.11'
  - '@turbo/darwin-arm64@2.10.11'
  - '@turbo/linux-64@2.10.11'
  - '@turbo/linux-arm64@2.10.11'
  - '@turbo/windows-64@2.10.11'
  - '@turbo/windows-arm64@2.10.11'
  - '@vitest/expect@4.1.11'
  - '@vitest/mocker@4.1.11'
  - '@vitest/pretty-format@4.1.11'
  - '@vitest/runner@4.1.11'
  - '@vitest/snapshot@4.1.11'
  - '@vitest/spy@4.1.11'
  - '@vitest/utils@4.1.11'
  - react-native-safe-area-context@5.9.1
  - supabase@2.115.0
  - turbo@2.10.11
  - vitest@4.1.11
  - expo-constants@57.0.20
  - expo-modules-core@57.0.20
  - expo@57.0.26
  - '@expo/ui@57.0.21'
  - expo-document-picker@57.0.3
  - expo-router@57.0.24
  - expo-updates@57.0.24
overrides:
  # GHSA-jqcg-44mw-7w3h; remove after Express's resolved dependency remains patched without this pin.
  proxy-addr: 2.0.8
  # GHSA-pqg4-j6r4-53mv; reviewed patch, retain until the native tooling graph resolves it without this pin.
  shell-quote: 1.11.0
